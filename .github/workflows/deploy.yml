# Имя воркфлоу
name: Build and Deploy Vue App to GitHub Pages

# Запускать при пуше в ветку main
on:
  push:
    branches: [ "main" ]

# Разрешить этому воркфлоу создавать и писать в ветку gh-pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Забираем код из репозитория
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      # 2. Устанавливаем Node.js
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3. Устанавливаем зависимости
      - name: Install dependencies 📦
        run: npm install

      # 4. Собираем проект
      - name: Build project 🔨
        run: npm run build

      # 5. Деплоим собранный проект в ветку gh-pages
      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
